[workspace]
name = "Advance-Robotics-tp1"
channels = [
  "https://prefix.dev/robostack-jazzy",
  "https://prefix.dev/conda-forge",
]
platforms = ["osx-arm64"]

[dependencies]
ros-jazzy-desktop = "*"
ros-jazzy-ros-gz-sim = "*"
ros-jazzy-ros-gz-bridge = "*"
ros-jazzy-ros-gz-image = "*"
ros-jazzy-turtlebot3-msgs = "*"
ros-jazzy-turtlebot3-teleop = "*"
ros-dev-tools = "*"
colcon-common-extensions = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
ros-jazzy-tf-transformations = ">=1.1.1,<2"
open3d = ">=0.19.0,<0.20"
ros-jazzy-joy = ">=3.3.0,<4"
ros-jazzy-teleop-twist-joy = ">=2.6.5,<3"

[activation]
scripts = ["pixi-activate.sh"]

[tasks]
build = "bash -c 'cd ros_ws && colcon build'"
sim = "ros2 launch tp1_teach_repeat sim.launch.py"
teleop = "ros2 run tp1_teach_repeat teleop --ros-args -p use_sim_time:=true"
teach = "ros2 launch tp1_teach_repeat teach.launch.py"
repeat = "ros2 launch tp1_teach_repeat repeat.launch.py"
rviz = "rviz2 -d ros_ws/install/tp1_teach_repeat/share/tp1_teach_repeat/config/tp1_view.rviz --ros-args -p use_sim_time:=true"
rviz-tf = "rviz2 -d ros_ws/install/tp1_teach_repeat/share/tp1_teach_repeat/config/tp1_tf_view.rviz --ros-args -p use_sim_time:=true"
test = "env ROS_DOMAIN_ID=43 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest ros_ws/src/Grupo4/tp1_teach_repeat/test -v"
